    // -------------------------------------------------------------
    // 3. APPLICATION LOGIC (Limiting to 2 Attempts)
    // -------------------------------------------------------------
    let timerInterval;
    let studentDetails = { name: "", phone: "" };

    function startTest() {
        const name = document.getElementById("student-name").value.trim();
        const phone = document.getElementById("student-phone").value.trim();
        const errorMsg = document.getElementById("login-error");

        if (!name || !phone) {
            errorMsg.innerText = "Please enter your name and phone number.";
            return;
        }

        // Whitelist check
        if (!allowedPhoneNumbers.includes(phone)) {
            errorMsg.innerText = "Phone number is not authorized for this mock test.";
            return;
        }

        // Enforce maximum 20 attempts limit
       let currentAttempts = parseInt(localStorage.getItem("attempts_" + phone) || "0", 10);
        if (currentAttempts >= 20) {
            errorMsg.innerText = "You have reached the maximum limit of 20 attempts for this test.";
            return;
        }

        studentDetails.name = name;
        studentDetails.phone = phone;

        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("exam-section").classList.remove("hidden");
        document.getElementById("timer").classList.remove("hidden");

        renderQuestions();
        startTimer(90 * 60); // 90 Minutes countdown
    }

    function renderQuestions() {
        const container = document.getElementById("questions-container");
        container.innerHTML = "";

        questionsData.forEach((q, index) => {
            const qDiv = document.createElement("div");
            qDiv.className = "question-card";
            
            let optionsHTML = "";
            q.options.forEach((opt, optIdx) => {
                const optVal = String.fromCharCode(65 + optIdx); // A, B, C, D
                optionsHTML += `
                    <label>
                        <input type="radio" name="q${q.id}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });

            qDiv.innerHTML = `
                <p><strong>Q${index + 1}. ${q.q}</strong></p>
                <div class="options">${optionsHTML}</div>
            `;
            container.appendChild(qDiv);
        });
    }

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        const display = document.getElementById("time-display");
        
        timerInterval = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting test.");
                submitTest();
            }
        }, 1000);
    }

    function submitTest() {
        clearInterval(timerInterval);
        document.getElementById("timer").classList.add("hidden");
        document.getElementById("exam-section").classList.add("hidden");
        document.getElementById("result-section").classList.remove("hidden");

        // Increment attempt count in LocalStorage
        let currentAttempts = parseInt(localStorage.getItem("attempts_" + studentDetails.phone) || "0", 10);
        localStorage.setItem("attempts_" + studentDetails.phone, (currentAttempts + 1).toString());

        let correct = 0;
        let wrong = 0;
        let unattempted = 0;

        let previewHTML = "<h3 style='text-align: center;'>Detailed Review & Answer Sheet</h3>";

        questionsData.forEach((q, index) => {
            const selectedOption = document.querySelector(`input[name="q${q.id}"]:checked`);
            const userAns = selectedOption ? selectedOption.value : null;

            let statusText = "";
            if (!userAns) {
                unattempted++;
                statusText = `<span class="unattempted">Unattempted (0)</span>`;
            } else if (userAns === q.ans) {
                correct++;
                statusText = `<span class="correct">Correct (+2)</span>`;
            } else {
                wrong++;
                statusText = `<span class="wrong">Wrong (-0.5)</span>`;
            }

            // Options view with color formatting
            let optionsListHTML = "<div style='margin-left: 15px; margin-top: 5px;'>";
            q.options.forEach((opt, optIdx) => {
                const optLetter = String.fromCharCode(65 + optIdx);
                let optStyle = "color: #333;";

                if (optLetter === q.ans) {
                    optStyle = "color: green; font-weight: bold;";
                } else if (optLetter === userAns && userAns !== q.ans) {
                    optStyle = "color: red; text-decoration: line-through;";
                }

                optionsListHTML += `<div style="${optStyle}">${opt}</div>`;
            });
            optionsListHTML += "</div>";

            previewHTML += `
                <div class="question-card">
                    <p><strong>Q${index + 1}. ${q.q}</strong> — Status: ${statusText}</p>
                    ${optionsListHTML}
                    <p style="margin-top: 8px; font-size: 14px;">
                        <strong>Your Answer:</strong> ${userAns ? userAns : "None"} | 
                        <strong>Correct Answer:</strong> <span style="color: green; font-weight: bold;">${q.ans}</span>
                    </p>
                </div>
            `;
        });

        const totalScore = (correct * 2) - (wrong * 0.5);

        document.getElementById("result-summary").innerHTML = `
            <p><strong>Name:</strong> ${studentDetails.name}</p>
            <p><strong>Phone:</strong> ${studentDetails.phone}</p>
            <p><strong>Correct Answers (+2):</strong> ${correct}</p>
            <p><strong>Wrong Answers (-0.5):</strong> ${wrong}</p>
            <p><strong>Unattempted:</strong> ${unattempted}</p>
            <p><strong>Final Score:</strong> ${totalScore} / 200</p>
            <p><strong>Attempts Used:</strong> ${currentAttempts + 1} / 2</p>
        `;

        document.getElementById("preview-container").innerHTML = previewHTML;

        // Data Storage Calls
        saveToGoogleSheet(studentDetails.name, studentDetails.phone, totalScore, correct, wrong, unattempted);
        saveToFirebase(studentDetails.name, studentDetails.phone, totalScore, correct, wrong, unattempted);
    }

    function downloadPDF() {
        const element = document.getElementById("result-section");
        const opt = {
            margin:       [10, 10, 10, 10],
            filename:     `${studentDetails.name}_Mock_Test_Result.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };
        html2pdf().set(opt).from(element).save();
    }

    // -------------------------------------------------------------
    // 4. BACKEND STORAGE FUNCTIONS
    // -------------------------------------------------------------
    function saveToGoogleSheet(name, phone, score, correct, wrong, unattempted) {
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwiav_zyGZpa-Gayjf0rBI9n05HaGPr-sD7oy3IFsOyONttdcHCgZdNh-HM5pBSjPlpdA/exec";

    const payload = {
        name: name,
        phone: phone,
        score: score,
        correct: correct,
        wrong: wrong,
        unattempted: unattempted,
        date: new Date().toLocaleString("en-IN")
    };

    fetch(webAppUrl, {
        method: "POST",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
    })
    .then(response => console.log("Google Sheet Response Sent!"))
    .catch(error => console.error("Google Sheet Error:", error));
}

    function saveToFirebase(name, phone, score, correct, wrong, unattempted) {
        if (!db) return;
        
        db.collection("results").add({
            name: name,
            phone: phone,
            score: score,
            correct: correct,
            wrong: wrong,
            unattempted: unattempted,
            date: new Date().toLocaleString()
        })
        .then((docRef) => console.log("Saved to Firebase ID:", docRef.id))
        .catch((error) => console.error("Firebase Error:", error));
    }
</script>
